name: Actualizar apartamentos

on:
  schedule:
    - cron: '0 12 * * 1'   # cada lunes, 8:00 a. m. hora de RD
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-apartamentos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Revisar enlaces y generar la lista
        run: node scripts/fetch-apartments.js

      - name: Guardar cambios
        run: |
          if git diff --quiet -- data/apartamentos.json index.html; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apartamentos.json index.html
          git commit -m "Actualiza la lista de apartamentos"
          git push
