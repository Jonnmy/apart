<!DOCTYPE html>
<html lang="es">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Paleta: azul petróleo (navegación) · verde salvia (progreso) · ámbar (lo editable) · arena cálida (fondo).
   Tipos: Bricolage Grotesque para cifras y títulos, Plus Jakarta Sans para leer.
   Disposición: una columna de tarjetas con barra inferior fija, pensada para iPhone. */
:root{
  --paper:#F6F3EC; --card:#FFFFFF; --ink:#16272C; --soft:#5C6F75; --line:#E4DFD3;
  --deep:#0F4C5C; --deep-2:#14606F; --on-deep:#FFFDF8;
  --sage:#2F8A6B; --sage-bg:#E2F1E9; --sage-line:#A8D8C3;
  --amber:#9A6B06; --amber-bg:#FFF4CE; --amber-line:#E8C65A;
  --rose:#B5423A; --rose-bg:#FBE8E5;
  --shadow:0 1px 2px rgba(22,39,44,.05), 0 8px 24px -12px rgba(22,39,44,.18);
  --display:'Bricolage Grotesque',Georgia,serif;
  --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1619; --card:#19252A; --ink:#ECF2F2; --soft:#9CB0B6; --line:#28383E;
  --deep:#0B3A47; --deep-2:#0F4C5C; --on-deep:#F3FAF9;
  --sage:#62C9A1; --sage-bg:#16352B; --sage-line:#2C5A4A;
  --amber:#E7B64E; --amber-bg:#3B3010; --amber-line:#6E5A1C;
  --rose:#F08C82; --rose-bg:#3A1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0E1619; --card:#19252A; --ink:#ECF2F2; --soft:#9CB0B6; --line:#28383E;
  --deep:#0B3A47; --deep-2:#0F4C5C; --on-deep:#F3FAF9;
  --sage:#62C9A1; --sage-bg:#16352B; --sage-line:#2C5A4A;
  --amber:#E7B64E; --amber-bg:#3B3010; --amber-line:#6E5A1C;
  --rose:#F08C82; --rose-bg:#3A1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
h1,h2,h3,.num{font-family:var(--display);text-wrap:balance}
.top{background:linear-gradient(170deg,var(--deep-2),var(--deep));color:var(--on-deep);
  padding:calc(20px + env(safe-area-inset-top)) 20px 22px;border-radius:0 0 26px 26px}
.top .eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.72}
.top h1{margin:4px 0 0;font-size:26px;font-weight:800;letter-spacing:-.01em}
.top .sub{margin-top:3px;font-size:14px;opacity:.82}
main{max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card>h2{margin:0 0 4px;font-size:19px;font-weight:700;letter-spacing:-.01em}
.card>h2+.lede{margin:0 0 14px;color:var(--soft);font-size:14px}
.card>h2:last-child,.card>h2+*:not(.lede){margin-top:0}
h3{margin:18px 0 8px;font-size:15px;font-weight:700}
.note{font-size:13.5px;color:var(--soft);margin:10px 0 0}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;max-width:160px;background:none;border:0;cursor:pointer;color:var(--soft);
  font:600 11.5px/1.1 var(--body);padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--deep)}
@media (prefers-color-scheme:dark){.tabs button[aria-current="page"]{color:var(--sage)}}
:root[data-theme="dark"] .tabs button[aria-current="page"]{color:var(--sage)}
:focus-visible{outline:3px solid var(--amber-line);outline-offset:2px;border-radius:6px}
/* hero */
.hero{display:flex;gap:18px;align-items:center}
.ring{flex:none;width:118px;height:118px;position:relative}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--display);font-size:27px;font-weight:800;letter-spacing:-.02em}
.ring b em{font-style:normal;font-family:var(--body);font-size:10.5px;font-weight:600;color:var(--soft);letter-spacing:.04em;text-transform:uppercase}
.hero .t{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.25}
.hero .s{color:var(--soft);font-size:14px;margin-top:6px}
/* tiles */
.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.grid.three{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.tile .l{font-size:12px;font-weight:700;color:var(--soft);letter-spacing:.02em}
.tile .v{font-family:var(--display);font-size:23px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .h{font-size:11.5px;color:var(--soft);margin-top:3px;line-height:1.35}
.tile.g{background:var(--sage-bg);border-color:var(--sage-line)}.tile.g .v{color:var(--sage)}
.tile.r{background:var(--rose-bg);border-color:transparent}.tile.r .v{color:var(--rose)}
.tile.y{background:var(--amber-bg);border-color:var(--amber-line)}.tile.y .v{color:var(--amber)}
/* quick entry */
.quick{background:linear-gradient(165deg,var(--deep-2),var(--deep));color:var(--on-deep);border:0}
.quick h2{color:var(--on-deep)}
.quick .lede{color:rgba(255,253,248,.78)!important}
.quick .row{display:flex;gap:10px;align-items:stretch;margin-top:12px}
.quick input{flex:1;min-width:0;font:700 22px var(--display);font-variant-numeric:tabular-nums;
  padding:12px 14px;border-radius:13px;border:2px solid var(--amber-line);background:var(--amber-bg);color:#16272C}
@media (prefers-color-scheme:dark){.quick input{color:var(--ink)}}
:root[data-theme="dark"] .quick input{color:var(--ink)}
.quick .ok{flex:none;background:var(--on-deep);color:var(--deep);border:0;border-radius:13px;padding:0 20px;font:700 15px var(--body);cursor:pointer}
.quick .done{margin-top:10px;font-size:13.5px;color:rgba(255,253,248,.9);display:flex;align-items:center;gap:7px}
/* chart */
.chart{width:100%;height:188px;display:block;overflow:visible}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--soft);margin-top:10px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:3px;margin-right:6px}
/* escenarios */
.esc{display:flex;flex-direction:column;gap:9px}
.esc button{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;
  border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:13px 15px;font:inherit;cursor:pointer}
.esc button[aria-pressed="true"]{border-color:var(--sage);background:var(--sage-bg)}
.esc .n{font-weight:700;font-size:15px}.esc .d{font-size:12.5px;color:var(--soft);margin-top:1px}
.esc .a{font-family:var(--display);font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;flex:none}
.esc .a span{display:block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--soft)}
/* forms */
.fields{display:flex;flex-direction:column;gap:14px}
.fields.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.field .h{font-size:12.5px;color:var(--soft);margin-top:5px;line-height:1.4}
input[type=number],input[type=month],input[type=text],select,textarea{
  width:100%;font:600 16px var(--body);font-variant-numeric:tabular-nums;padding:11px 13px;border-radius:12px;
  border:1.5px solid var(--amber-line);background:var(--amber-bg);color:var(--ink);-webkit-appearance:none;appearance:none}
select{background-image:none}
textarea{font-weight:400;font-size:12px;min-height:88px;font-family:ui-monospace,monospace}
.btn{border:0;border-radius:12px;padding:12px 18px;font:700 14.5px var(--body);background:var(--deep);color:var(--on-deep);cursor:pointer}
.btn.ghost{background:transparent;color:var(--deep);border:1.5px solid var(--line)}
.btn.block{display:block;width:100%}
@media (prefers-color-scheme:dark){.btn.ghost{color:var(--sage)}}
:root[data-theme="dark"] .btn.ghost{color:var(--sage)}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
  padding:9px 15px;font:600 14px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--deep);color:var(--on-deep);border-color:var(--deep)}
.seg{display:flex;gap:8px}.seg .chip{flex:1;text-align:center}
/* month list */
.months{display:flex;flex-direction:column;gap:7px}
.m{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:10px 13px}
.m.hito{border-color:var(--sage-line);background:var(--sage-bg)}
.m .i{flex:none;width:30px;font-family:var(--display);font-weight:800;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.m .d{flex:1;min-width:0}
.m .d b{display:block;font-size:14.5px;font-weight:700;text-transform:capitalize}
.m .d span{font-size:12px;color:var(--soft)}
.m input{flex:none;width:112px;padding:9px 10px;font-size:15.5px;text-align:right}
.m .st{flex:none;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.st.ok{background:var(--sage-bg);color:var(--sage)}.st.lo{background:var(--amber-bg);color:var(--amber)}
.st.no{background:var(--rose-bg);color:var(--rose)}.st.pend{background:transparent;color:var(--soft)}
.bar{height:9px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--sage);border-radius:999px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .45s ease}
 .anim .ring circle+circle{animation:ringIn 1.1s cubic-bezier(.2,.8,.2,1) both}
 .anim .ring b{animation:fadeUp .7s .25s ease both}
 .anim .chart .ln{stroke-dasharray:1;animation:draw 1.3s .15s ease-out both}
 .anim .chart .ar{animation:fadeIn 1s .6s ease both}
 .anim .card{animation:fadeUp .5s ease both}
 .anim .card:nth-child(2){animation-delay:.05s}.anim .card:nth-child(3){animation-delay:.1s}.anim .card:nth-child(4){animation-delay:.15s}}
@keyframes ringIn{from{stroke-dasharray:0 400}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
.cd{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;padding:4px 10px;border-radius:999px;background:var(--sage-bg);border:1px solid var(--sage-line);font-size:12.5px;font-weight:700;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;max-width:88vw;
 background:var(--deep);color:var(--on-deep);padding:12px 18px;border-radius:16px;font-weight:600;font-size:14.5px;text-align:center;
 box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toast 3.2s ease both;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,12px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}
.cf{position:fixed;top:-12px;width:8px;height:12px;border-radius:2px;z-index:59;pointer-events:none;animation:fall var(--d) cubic-bezier(.25,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.9}}
/* apartments */
.apt{padding:0;overflow:hidden}
.apt .head{padding:16px 18px;display:flex;flex-direction:column;gap:9px;border-left:5px solid var(--z,var(--line))}
.apt .ttl{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.apt .nm{font-family:var(--display);font-weight:800;font-size:17.5px;line-height:1.2;letter-spacing:-.01em}
.apt .meta{font-size:12.5px;color:var(--soft);margin-top:3px}
.apt .price{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.apt .price b{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.apt .price span{font-size:13px;color:var(--soft)}
.pill{display:inline-block;border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:700;white-space:nowrap;line-height:1.35}
.pill.g{background:var(--sage-bg);color:var(--sage)}.pill.r{background:var(--rose-bg);color:var(--rose)}
.pill.y{background:var(--amber-bg);color:var(--amber)}
.pill.n{background:var(--paper);color:var(--soft);border:1px solid var(--line)}
.apt .more{border-top:1px solid var(--line);padding:14px 18px;background:var(--paper)}
.apt .foot{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 18px;border-top:1px solid var(--line)}
.apt .foot button{background:none;border:0;color:var(--deep);font:700 13.5px var(--body);cursor:pointer;padding:4px 0}
@media (prefers-color-scheme:dark){.apt .foot button{color:var(--sage)}}
:root[data-theme="dark"] .apt .foot button{color:var(--sage)}
.apt .foot label{font-size:13px;color:var(--soft);display:flex;align-items:center;gap:7px;cursor:pointer}
.apt .foot input{width:19px;height:19px;accent-color:var(--sage)}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 14px;font-size:14px}
.kv dt{color:var(--soft)}
.kv dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.kv dd.pos{color:var(--sage)}.kv dd.neg{color:var(--rose)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px}
table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:100%}
th{font-size:11.5px;text-align:left;color:var(--soft);padding:7px 10px;white-space:nowrap;font-weight:700}
td{padding:8px 10px;border-top:1px solid var(--line);white-space:nowrap}
td:first-child,th:first-child{position:sticky;left:0;background:var(--card);font-weight:600}
.leg{display:flex;flex-direction:column;gap:9px;font-size:14px}
.leg .sw{display:inline-block;width:15px;height:15px;border-radius:5px;vertical-align:-2px;margin-right:9px}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:14.5px}
a{color:var(--deep);text-underline-offset:2px}
@media (prefers-color-scheme:dark){a{color:var(--sage)}}
:root[data-theme="dark"] a{color:var(--sage)}
.alert{border-radius:14px;padding:13px 15px;font-size:13.5px;line-height:1.45}
.alert.r{background:var(--rose-bg);color:var(--rose);border:1px solid var(--rose)}
.alert.y{background:var(--amber-bg);color:var(--amber)}
details>summary{cursor:pointer;font-weight:700;font-size:14.5px;padding:10px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:'+';font-family:var(--display);font-size:20px;color:var(--soft)}
details[open]>summary::after{content:'–'}
details{border-bottom:1px solid var(--line)}
details:last-of-type{border-bottom:0}
@media (max-width:360px){.grid{grid-template-columns:1fr}.hero{flex-direction:column;text-align:center}}
</style>
</head>
<body>
<header class="top">
  <div class="eyebrow" id="eyebrow">Mi plan</div>
  <h1>Mi apartamento en San Cristóbal</h1>
  <div class="sub" id="sub">Ahorrando para comprar</div>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs"></nav>
<script>
// ===== LOGIC (pure) =====
const DEF = {
  ingreso:2500, renta:500, gastos:800, otros:0, ahorroActual:0, meses:36, fondo:8000, reserva:3000,
  neto:'pendiente', inicio:'2026-11', escenario:'int',
  esc:{cons:800, int:1000, opt:1200},
  fx0:59.52, fxFuture:60,
  cierreNormal:4, cierreBajo:1, topeBase:5450851.12, topeCrece:5,
  inicialPct:20, tasa:11.5, plazo:20, extras:5000, ingresoRD:150000,
  precioEsc:'mod',
  g:{bajo:[8,15,30], medio:[6,14,25], premium:[4,10,20]},
  real:{}, obj3:'pal3', obj2:'pal2', compare:[], tipo:3, savedAt:0, lastBackup:0
};
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const clone = o => JSON.parse(JSON.stringify(o));
function merge(base, over){
  const out = clone(base);
  (function m(o, s){ for (const k in s){ if (s[k] && typeof s[k]==='object' && !Array.isArray(s[k]) && o[k] && typeof o[k]==='object' && !Array.isArray(o[k])) m(o[k], s[k]); else o[k]=s[k]; } })(out, over||{});
  return out;
}
const pmt = (P,i,n) => i===0 ? P/n : P*i/(1-Math.pow(1+i,-n));
const GI = {cons:0, mod:1, alto:2};
const nMeses = S => Math.min(60, Math.max(6, Math.round(num(S.meses)||36)));
const capacidad = S => num(S.ingreso)-num(S.renta)-num(S.gastos)-num(S.otros);
const planMes = S => num(S.esc[S.escenario]);
const enteredKeys = S => Object.keys(S.real).filter(k => S.real[k]!=='' && S.real[k]!=null && isFinite(parseFloat(S.real[k])) && +k < nMeses(S));
const acumReal = S => num(S.ahorroActual) + enteredKeys(S).reduce((a,k)=>a+num(S.real[k]),0);
const proyeccion = S => acumReal(S) + Math.max(0, nMeses(S)-enteredKeys(S).length)*planMes(S);
function reservas(S, total){
  const f = Math.min(Math.max(total,0), num(S.fondo));
  const r = Math.min(Math.max(total,0)-f, num(S.reserva));
  return {fondo:f, reserva:r, disp: Math.max(0,total)-f-r};
}
const topeFuturo = S => num(S.topeBase)*Math.pow(1+num(S.topeCrece)/100, nMeses(S)/12);
function calc(S, a, override){
  const precio = override || a.precio;
  const g = num(S.g[a.seg][GI[S.precioEsc]])/100;
  const fx0 = num(S.fx0)||DEF.fx0, fxF = num(S.fxFuture)||DEF.fxFuture;
  let nowRD, nowUSD, futRD, futUSD;
  if (a.mon==='USD'){ nowUSD=precio; nowRD=precio*fx0; futUSD=precio*(1+g); futRD=futUSD*fxF; }
  else { nowRD=precio; nowUSD=precio/fx0; futRD=precio*(1+g); futUSD=futRD/fxF; }
  const ini = Math.max(num(S.inicialPct), a.ini||0)/100;
  const iniUSD = futUSD*ini;
  const cierreUSD = futUSD*num(S.cierreNormal)/100;
  const cierreBajoUSD = futUSD*num(S.cierreBajo)/100;
  const cash = iniUSD + cierreUSD;
  const califica = futRD <= topeFuturo(S);
  const loan = futRD*(1-ini);
  const cuota = pmt(loan, num(S.tasa)/100/12, Math.round(num(S.plazo)*12));
  const cuotaTotal = cuota + num(S.extras);
  const ratio = cuotaTotal/Math.max(1,num(S.ingresoRD));
  const sem = ratio<=0.30 ? 'g' : ratio<=0.35 ? 'y' : 'r';
  const disp = reservas(S, proyeccion(S)).disp;
  const cashOK = disp >= cash;
  const falta = Math.max(0, cash-disp);
  const m = Math.max(1, nMeses(S)-enteredKeys(S).length);

function vAhorro(){

  let rows='';
  for(let i=0;i<n;i++){

    rows+=`<div class="m ${hito?'hito':''}"><div class="i">${i+1}${hito?'★':''}</div><div class="d"><b>${mesCorto(i)}</b><span>${has?(r>=p?'+':'')+usd(r-p)+' vs. tu plan':'Previsto '+usd(p)}</span></div>

  const hitos=[6,12,18,24,30,36].filter(m=>m<=n).map(m=>{let a=num(S.ahorroActual);for(let i=0;i<m;i++)a+=ent.includes(String(i))?num(S.real[i]):p;

function cmpTable(){

  if(t.dataset.obj){const a=byId(t.dataset.obj);S[a.h===3?'obj3':'obj2']=a.id;save();view='inicio';location.hash='inicio';window.scrollTo(0,0);render();return;}
  if(t.id==='qkb'){const el=document.getElementById('qk'),mi=Math.max(0,Math.min(nMeses(S)-1,mesActual()));
    const meta=()=>num(S.fondo)+num(S.reserva)+calc(S,byId(S.obj3)).cash,p0=acumReal(S)/Math.max(1,meta());
    if(el.value==='')delete S.real[mi];else S.real[mi]=parseFloat(el.value)||0;save();render();
    const v=num(S.real[mi]),p1=acumReal(S)/Math.max(1,meta()),hit=[1,.75,.5,.25].find(h=>p0<h&&p1>=h);
    if(hit){confeti(90);toast(hit===1?'🏠 ¡Llegaste a tu meta, Valery! Lo lograste.':`🎉 ¡Ya llevas el ${hit*100}% de tu meta!`);}
    else if(v>0){confeti(v>=planMes(S)?50:25);toast(v>=planMes(S)?'¡Mes cumplido! 💪 Sigue así.':'¡Guardado! Cada peso cuenta. 💚');}
    return;}
  if(t.id==='dl'){S.lastBackup=Date.now();save();const txt=JSON.stringify(S),d=new Date(),nm=`mi-apartamento-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
    const f=new File([txt],nm,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Copia de Mi apartamento'}).catch(()=>{});}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=nm;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}
    render();toast('Copia lista. Guárdala en Archivos o en iCloud. 💾');return;}
  if(t.id==='cp'){S.lastBackup=Date.now();save();const ta=document.getElementById('bk'),msg=document.getElementById('bkmsg');ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
    const say=ok=>{msg.textContent=ok?'Copiado.':'Selecciona el texto y cópialo a mano.';};
    let done=false;try{done=document.execCommand('copy');}catch(_){}
    if(done){say(true);}
    else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(()=>say(true),()=>say(false));}
    else say(false);return;}
  if(t.id==='rs'){try{const o=JSON.parse(document.getElementById('bk').value);if(!o||typeof o!=='object'||Array.isArray(o))throw 0;S=merge(DEF,o);save();render();const m=document.getElementById('bkmsg');if(m)m.textContent='Datos restaurados.';}
    catch(_){document.getElementById('bkmsg').textContent='Ese texto no sirve, revisa que esté completo.';}}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='fl'&&el.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||Array.isArray(o)||!('real' in o))throw 0;S=merge(DEF,o);save();render();toast('Datos restaurados. ✅');}catch(_){toast('Ese archivo no es una copia de la app.');}};r.readAsText(el.files[0]);return;}
  if(el.dataset.cmp){const id=el.dataset.cmp;let c=S.compare.filter(x=>x!==id);
    if(el.checked){c.push(id);if(c.length>3)c.shift();}S.compare=c;save();render();return;}
  if(el.dataset.k){let v=el.value;
    if(el.type==='number'){if(v===''){if(el.dataset.k.startsWith('real.')){delete S.real[el.dataset.k.slice(5)];save();render();return;}v=0;}else v=parseFloat(v);}
    setPath(el.dataset.k,v);save();render();}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='qk'){e.preventDefault();document.getElementById('qkb').click();}});
window.addEventListener('hashchange',()=>{view=(location.hash||'#inicio').slice(1);render();});
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
